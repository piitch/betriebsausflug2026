name: Deploy GitHub Pages

on:
  push:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    # Nur der Standard-Branch des Repositorys wird veröffentlicht
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Tests
        run: npm test

      - name: Supabase-Verbindung eintragen
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_KEY: ${{ vars.SUPABASE_KEY }}
        run: |
          node -e '
            const cfg = { supabaseUrl: process.env.SUPABASE_URL || "", supabaseKey: process.env.SUPABASE_KEY || "" };
            require("fs").writeFileSync("public/config.js", "window.EISSTOCK_CONFIG = " + JSON.stringify(cfg, null, 2) + ";\n");
            console.log(cfg.supabaseUrl ? "Supabase: " + cfg.supabaseUrl : "Keine Supabase-Variablen gesetzt -> lokaler Modus");
          '

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - id: deployment
        uses: actions/deploy-pages@v4
